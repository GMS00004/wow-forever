# Todo PR aberto por quem não é o Bruno já sai pedindo a revisão dele.
name: pedir revisão

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  pedir:
    if: github.event.pull_request.user.login != 'GMS00004' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers: ['GMS00004'],
            });
