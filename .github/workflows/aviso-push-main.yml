# O plano Free da GitHub não trava o main de repositório privado. Este workflow é o alarme: quando alguém que não é
# o Guilherme muda o main sem ser ele (push direto, force push ou merge de PR feito por outra pessoa), abre uma issue
# para o Guilherme com o que mudou e o comando para voltar. O combinado está no CONTRIBUTING.md.
name: aviso de push no main

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  aviso:
    if: github.actor != 'GMS00004'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const p = context.payload;
            const forcado = p.forced ? ' (force push)' : '';
            const commits = (p.commits || [])
              .map((c) => `- ${c.id.slice(0, 7)} ${c.message.split('\n')[0]} (${c.author?.username || c.author?.name || '?'})`)
              .join('\n') || '- (nenhum commit listado)';
            const corpo = [
              `@GMS00004, ${context.actor} mudou o \`main\`${forcado} sem passar por você.`,
              '',
              `Antes: \`${p.before}\``,
              `Depois: \`${p.after}\``,
              `Comparar: ${p.compare}`,
              '',
              'Commits:',
              commits,
              '',
              'Para voltar o main ao que era antes, do seu clone (que ainda tem o commit de antes):',
              '```',
              `git push --force-with-lease origin ${p.before}:main`,
              '```',
              'O combinado (CONTRIBUTING.md): o main só muda por PR, e quem faz o merge é o Guilherme.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Mudança no main por ${context.actor}${forcado}`,
              body: corpo,
              assignees: ['GMS00004'],
            });
