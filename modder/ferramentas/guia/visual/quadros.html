<body><div class="veu"></div>
<div class="col" style="left:24px"><div class="rotulo" id="rotA"></div><div class="zoom" id="A"></div></div>
<div class="col" style="left:906px"><div class="rotulo" id="rotB"></div><div class="zoom" id="B"></div></div>
<script>
const I = n => `icones/${n}.jpg`;
const im = (n, c) => `<img src="${I(n)}"${c ? ` class="${c}"` : ""}>`;

/* ================= HOJE ================= */
const ABAS = ["Now", "Pet", "Families", "Talents", "Combat", "Professions", "Help"];
function blz(aba, blocos) {
  let tabs = ABAS.map((a, i) => `<div class="rbtn${a === aba ? " on" : ""}" style="left:${10 + i * 96}px;top:38px;width:94px">${a}</div>`).join("");
  let corpo = blocos.map(b => {
    if (b.t === "cab") return `<div class="bl cab" style="padding-left:${4 + 14 * ((b.nivel || 1) - 1)}px"><span class="pm">${b.aberta === false ? "+" : "&minus;"}</span>${b.s}${b.res && b.aberta === false ? `<span class="res">${b.res}</span>` : ""}</div>`;
    if (b.t === "linha") return `<div class="bl lin">${b.s}</div>`;
    if (b.t === "texto") return `<div class="bl txt">${b.s}</div>`;
    if (b.t === "botao") return `<div class="bl bt"><span class="rbtn">${b.s}</span></div>`;
    return `<div class="bl esp"></div>`;
  }).join("");
  return `<div class="blz"><div class="tit">GuiaForever - Hexumlite Bull</div><div class="busca">Search</div><div class="fechar">&times;</div>
    ${tabs}<div class="tudo"></div><div class="tudoTxt">Show all</div>
    <div class="rol">${corpo}</div>
    <div class="barra"><div class="seta">&#9650;</div><div class="trilho"></div><div class="pega"></div><div class="seta baixo">&#9660;</div></div></div>`;
}
const C = (k, s) => `<span class="c-${k}">${s}</span>`;
const cab = (s, o = {}) => ({ t: "cab", s, ...o });
const L = s => ({ t: "linha", s });
const T = s => ({ t: "texto", s });
const BT = s => ({ t: "botao", s });
const ESP = { t: "espaco" };

/* ================= PROPOSTA ================= */
const NAV = [["Now", "inv_misc_book_09"], ["Pet", "ability_hunter_pet_boar"], ["Families", "ability_hunter_beasttaming"], ["Talents", "ability_hunter_beasttraining"],
  ["Combat", "ability_impalingbolt"], ["Professions", "inv_misc_pelt_wolf_01"], ["Help", "inv_misc_questionmark"]];
function elv(aba, area, extra = "") {
  const nav = NAV.map(([n, ic]) => `<div class="nav${n === aba ? " on" : ""}">${im(ic)}${n}${n === "Now" ? `<span class="qt">4</span>` : ""}</div>`).join("");
  return `<div class="elv">
    <div class="topo">${im("inv_misc_book_09", "livro")}<div><div class="nome">GuiaForever</div><div class="sub">Hexumlite Bull &middot; Hunter &middot; level 16</div></div>
      <div class="chips">
        <div class="chipE">${im("ability_hunter_beasttraining")}Talent <span class="n">0</span></div>
        <div class="chipE">${im("ability_hunter_pet_boar")}Boar <span class="n">16</span> <span class="ok">Happy</span></div>
        <div class="chipE">${im("inv_misc_pelt_wolf_01")}Skinning <span class="n" style="color:#ff8c1a">75/75</span></div>
      </div>
      <div class="buscaE">Search</div><div class="x">&#10005;</div></div>
    <div class="trilho">${nav}<div class="rodape"><span class="chave"></span>Show all</div></div>
    <div class="area">${area}</div><div class="rolE"></div>${extra}</div>`;
